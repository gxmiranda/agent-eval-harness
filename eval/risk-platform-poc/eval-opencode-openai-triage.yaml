# GRCAUTO-114 / GRCAUTO-43: Triage-tier OpenAI benchmark
#
# Tests lower-tier models (Luna) on triage tasks with relaxed thresholds.
# Per GRCAUTO-43 and current config/models.yaml:
#   - lower-tier (gpt-6-luna) for triage, audit comments, summaries
#
# Uses the same OpenCode runner and lockdown config as the deep analysis
# overlay, but with:
#   - openai/gpt-6-luna as the runtime model (triage tier)
#   - Relaxed thresholds per evaluation proposal Section 7.2
#
# Usage:
#   /eval-run --config eval/risk-platform-poc/eval-opencode-openai-triage.yaml \
#             --model openai/gpt-6-luna

extends: eval-opencode-openai.yaml

name: risk-platform-benchmark-opencode-openai-triage
description: >
  GRCAUTO-114 triage tier: OpenCode + OpenAI Luna for routine tasks.
  Validates that Luna is adequate for triage, audit comments, and summaries.

models:
  skill: openai/gpt-6-luna

# Section 7.2 triage thresholds (relaxed from deep analysis)
thresholds:
  d1_structural_completeness:
    min_pass_rate: 1.0           # Still must PASS
  d2_citation_quality:
    min_mean: 3.0                # Relaxed from 3.5
  d3_regulatory_mapping:
    min_mean: 2.5                # Relaxed -- triage rarely involves regulatory
  d4_consequence_framing:
    min_mean: 3.0                # Relaxed from 3.5
  d5_rating_accuracy:
    min_mean: 3.5                # Relaxed from 4.0
  d6_adversarial_durability:
    min_mean: 3.0                # Relaxed from 3.5
  d7_actionability:
    min_mean: 3.0                # Relaxed from 3.5
  d8_gap_detection:
    min_mean: 3.0                # Relaxed from 3.5
